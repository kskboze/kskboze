<header class="masthead">

    <span class="masthead__meta" id="cd-count">0枚</span>
  </div>
</header>

<main class="cd">
  <p class="cd__lede">
    1問1枚のカードです。スライドに貼る、掲示する、SNSに載せるといった用途を想定しています。
    URLの後ろに条件を付けると中身が変わります &mdash;
    <code>?must=1&amp;limit=20</code>(必修から20枚)、<code>?cats=bunker</code>(バンカーだけ)、
    <code>?answer=1</code>(答えと理由つき)、<code>?fig=0</code>(図解なし)、<code>?ids=x001,x002</code>(ID指定)。
    PNGに書き出すには <code>node tools/cards.js</code> を実行してください。
  </p>
  <div class="cd__grid" id="cards"></div>
</main>
